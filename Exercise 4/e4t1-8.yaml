kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: c1-svm0-nfs-pvcsnap-1
  namespace: default
spec:
  dataSource:
    name: c1-svm0-nfs-pvc-1-snap-1
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.ios
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: c1-svm0-nfs-sc
