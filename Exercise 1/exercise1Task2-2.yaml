apiVersion: v1
kind: Pod
metadata:
  name: hostpath2-pod
  namespace: default
spec:
  volumes:
  - name: local-vol
    hostPath:
      path: /hostVol2
      type: DirectoryOrCreate
  containers:
  - volumeMounts:
    - mountPath: /root/
      name: local-vol
    image: alpine:3.19.1
    imagePullPolicy: IfNotPresent
    name: linux
    command:
      - /bin/sh
      - "-c"
      - "sleep 60m"
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
